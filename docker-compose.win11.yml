services:
  windows:
    image: dockurr/windows
    container_name: radiobot-windows11-build
    environment:
      VERSION: "11"
      LANGUAGE: "English"
      CUSTOM: "Y"
      USERNAME: "builder"
      PASSWORD: "builder"
      RAM_SIZE: "8G"
      CPU_CORES: "4"
      DISK_SIZE: "64G"
      USER_PORTS: "22"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
      - "2222:22"
    volumes:
      - ./windows-storage-win11:/storage
      - ./windows-oem:/oem
      - .:/shared
    stop_grace_period: 2m
