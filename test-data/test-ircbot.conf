# RadioBot v5 Test Config
# Generated for end-to-end testing against the docker-compose.test.yml stack:
#   IRCd:  host.lan:6667
#   DB:    host.lan:3306 (MariaDB)
#   Icecast: host.lan:8000

// Base bot settings
Base {
    Nick RadioBotTest
    Fork 0
    OnlineBackup 0
    LogFile ircbot.log
    SecsBetweenUpdates 30
    DoSpam 1
    DoOnjoin 1
    DoTopic 1
    AutoRegOnHello 0
    EnableRequestSystem 1
    EnableRating 1
    AllowPMRequests 1
    RemotePort 10001
    PullNameFromAnyServer 0
    MultiSoundServer 0
    DJName TestDJ
    SendQ 300
    SSL_Cert ircbot.pem
    BackupDays 14
};

// IRC test server (InspIRCd)
IRC {
    Server0 {
        Host radiobot-ircd
        Port 6667
        SSL 0
        Channel0 {
            Channel #radio
            DoSpam 1
            DoOnjoin 1
            DoTopic 1
        };
    };
};

// Icecast test server for AutoDJ output / SS stats
SS {
    Server0 {
        Type icecast
        Host radiobot-icecast
        Port 8000
        StreamID 1
        Mount /radio
        User admin
        Pass hackme
    };
};

// Test MariaDB backend for users (exercises libmysql.dll)
Users_MySQL {
    Server radiobot-mariadb
    Port 3306
    DBName radiobot
    User radiobot
    Pass radiobot
    EncKey testkey
};

// Plugin load order
Plugin {
    Module0         plugins/TTS_Services.dll
    Module1         plugins/AutoDJ.dll
    Module2         plugins/Users_MySQL.dll
    Module3         plugins/Welcome.dll
};

// AutoDJ test settings
AutoDJ {
    Server {
        // Icecast source password
        password hackme
        // Directory containing test MP3s (trailing slash required)
        Content C:/RadioBot/test-data/mp3s/
        Bitrate 128
        Channels 2
        SampleRate 44100
        Public 0
        Reset 0
    };
    Options {
        QueuePlugin         plugins/AutoDJ/adjq_memory.dll
        Resampler           libresample
        AutoStart           1
        AutoPlayIfNoSource  1
        EnableTitleUpdates  1
        EnableFind          1
        EnableRequests      1
        Volume              0.8
    };
};

// Go to https://wiki.shoutirc.com/ for more information on available plugins and how to configure them
// and other configuration options.
